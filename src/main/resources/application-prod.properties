spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.baseline-on-migrate=false

spring.datasource.url=${DATABASE_URL:${DB_URL}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

server.forward-headers-strategy=framework
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.lifecycle.timeout-per-shutdown-phase=20s

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS}}
