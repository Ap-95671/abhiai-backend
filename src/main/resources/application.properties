spring.application.name=abhiai-backend
abhiai.admin.emails=${ABHIAI_ADMIN_EMAILS:}

spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/abhiai}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:abhishekprajapati}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

app.jwt.secret=${JWT_SECRET:AbhiAIBackendDevelopmentSecretKey2026SuperSecure123456}
app.jwt.access-token-ttl=15m

app.cors.allowed-origins=${ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:3000}}

app.social.profile.username-min-length=3
app.social.profile.username-max-length=30
app.social.profile.username-pattern=^[a-z0-9_]+$
app.social.profile.reserved-usernames=admin,administrator,api,auth,help,me,moderator,root,support,system
app.social.posts.max-text-length=1000
app.social.stories.lifetime=24h
app.social.stories.cleanup-interval-ms=3600000
app.media.storage-path=${MEDIA_STORAGE_PATH:uploads}
app.media.storage-type=${MEDIA_STORAGE_TYPE:local}
app.media.s3.provider=${MEDIA_S3_PROVIDER:AWS}
app.media.s3.bucket=${MEDIA_S3_BUCKET:}
app.media.s3.region=${MEDIA_S3_REGION:us-east-1}
app.media.s3.endpoint=${MEDIA_S3_ENDPOINT:}
app.media.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
app.media.s3.secret-key=${MEDIA_S3_SECRET_KEY:}
app.media.s3.session-token=${MEDIA_S3_SESSION_TOKEN:}
app.media.s3.path-style=${MEDIA_S3_PATH_STYLE:false}
app.media.s3.chunked-encoding=${MEDIA_S3_CHUNKED_ENCODING:true}
app.media.max-image-bytes=5242880
app.media.max-video-bytes=26214400
app.media.max-document-bytes=10485760
app.media.max-images-per-post=4
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=101MB

app.ai.provider=${AI_PROVIDER:openai}
app.ai.context.max-messages=${AI_CONTEXT_MAX_MESSAGES:40}
app.ai.context.max-characters=${AI_CONTEXT_MAX_CHARACTERS:60000}
app.ai.web-search.enabled=${AI_WEB_SEARCH_ENABLED:false}
app.ai.web-search.api-key=${BRAVE_SEARCH_API_KEY:}
app.ai.web-search.base-url=${BRAVE_SEARCH_BASE_URL:https://api.search.brave.com/res/v1/web/search}
app.ai.web-search.request-timeout=10s

app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.openai.instructions=You are AbhiAI, a helpful, accurate, and concise AI assistant.
app.ai.openai.connect-timeout=10s
app.ai.openai.request-timeout=60s

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.gemini.instructions=You are AbhiAI, a helpful, accurate, and concise AI assistant.
app.ai.gemini.request-timeout=60s

app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
app.ai.groq.instructions=You are AbhiAI, a helpful, accurate, and concise AI assistant.
app.ai.groq.request-timeout=60s

app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://host.docker.internal:11434}
app.ai.ollama.model=${OLLAMA_MODEL:gemma3:4b}
app.ai.ollama.instructions=You are AbhiAI, a helpful, accurate, and concise AI assistant.
app.ai.ollama.request-timeout=120s
